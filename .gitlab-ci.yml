image: rust:latest

stages:
  - validate
  - test
  - security
  - build
  - package
  - documentation
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  APT_CACHE_DIR: $CI_PROJECT_DIR/apt

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - target/
    - apt/

before_script:
  # Install GTK4 and Libadwaita development libraries
  - apt-get update -yq
  - apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config make

fmt:
  stage: validate
  script:
    - make fmt-check

clippy:
  stage: validate
  script:
    - make lint

test:
  stage: test
  script:
    - make test-all

audit:
  stage: security
  script:
    - cargo install cargo-audit
    - make audit
  allow_failure: true

deny:
  stage: security
  script:
    - cargo install --locked cargo-deny
    - make deny

build-release:
  stage: build
  script:
    - make build-release
  artifacts:
    paths:
      - target/release/pixie-app
    expire_in: 1 week

flatpak:
  stage: package
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache flatpak-builder
  script:
    - echo "Validating flatpak manifest..."
    - flatpak-builder --show-manifest packaging/flatpak/io.gitlab.demsking.Pixie.json > /dev/null

pages:
  stage: documentation
  only:
    - tags
  before_script:
    - apt-get update -yq && apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config make
    - cargo install mdbook
  script:
    - make docs-build
  artifacts:
    paths:
      - public
