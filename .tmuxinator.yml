name: pixie
root: ./

windows:
  - editor:
      layout: main-vertical
      panes:
        - ${EDITOR:-$SHELL}
  - app:
      panes:
        - make run
  - tests:
      panes:
        - cargo test
  - logs:
      panes:
        - echo "Application logs will appear here"
  - docs:
      panes:
        - make docs-serve
  - git:
      panes:
        - git status
