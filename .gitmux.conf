tmux:
  symbols:
    branch: "⎇ "
    hash: ":"
    ahead: "↑"
    behind: "↓"
    staged: "●"
    conflict: "✖"
    modified: "✚"
    untracked: "…"
    stashed: "⚑"
    clean: "✔"
  styles:
    clear: "[default]"
    state: "[fg=red,bold]"
    branch: "[fg=white,bold]"
    remote: "[fg=cyan]"
    staged: "[fg=green,bold]"
    conflict: "[fg=red,bold]"
    modified: "[fg=yellow,bold]"
    untracked: "[fg=blue]"
    stashed: "[fg=gray]"
    clean: "[fg=green,bold]"
  layout:
    - branch
    - " "
    - remote
    - " "
    - flags
  options:
    branch_max_len: 0
