[package]
name = "pixie-app"
version = "1.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pixie-core = { path = "../pixie-core" }
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "avif", "avif-native"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.27"
async-channel = "2.5"

[build-dependencies]
glib-build-tools = "0.22"
