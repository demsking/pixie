[package]
name = "pixie-core"
version = "1.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "avif", "avif-native"] }
thiserror = "2.0.18"
tracing = "0.1.44"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27.0"
kamadak-exif = "0.6.1"
little_exif = "0.6.23"

[dev-dependencies]
proptest = "1.11.0"
