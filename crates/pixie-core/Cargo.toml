[package]
name = "pixie-core"
version = "1.0.0-beta"
edition = "2024"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
image = { version = "0.25.2", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "avif", "avif-native"] }
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.10"

[dev-dependencies]
proptest = "1.4"
